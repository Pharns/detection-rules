name: Validate Sigma Rules

on:
  push:
    branches: [main]
    paths:
      - 'rules/**/*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rules/**/*.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sigma-cli
        run: pip install sigma-cli

      - name: Validate Sigma rules
        run: |
          echo "Validating Sigma rules..."
          errors=0
          for rule in $(find rules -name "*.yml"); do
            echo "Checking: $rule"
            # Retry once: sigma check downloads MITRE ATT&CK data and can time out on the network.
            if ! sigma check "$rule" 2>&1 && ! sigma check "$rule" 2>&1; then
              echo "::error file=$rule::Sigma check failed (rule or condition error)"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::error::$errors rule(s) failed sigma check - see above"
            exit 1
          fi
          # Validation *issues* (e.g. tag or logsource style warnings) do not fail sigma check's exit code;
          # they are shown in the output above for review.
          echo "All rules passed sigma check."

      - name: Count rules
        run: |
          count=$(find rules -name "*.yml" | wc -l)
          echo "Total rules: $count"
          echo "## Sigma Detection Rules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $count rules**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          for dir in rules/*/; do
            category=$(basename "$dir")
            category_count=$(find "$dir" -name "*.yml" | wc -l)
            echo "| $category | $category_count |" >> $GITHUB_STEP_SUMMARY
          done
