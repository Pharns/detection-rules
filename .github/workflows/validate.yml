name: Validate Sigma Rules

on:
  push:
    branches: [main]
    paths:
      - 'rules/**/*.yml'
  pull_request:
    branches: [main]
    paths:
      - 'rules/**/*.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install sigma-cli
        run: pip install sigma-cli

      - name: Validate Sigma rules
        run: |
          echo "Validating Sigma rules..."
          errors=0
          for rule in $(find rules -name "*.yml"); do
            echo "Checking: $rule"
            if ! sigma check "$rule" 2>&1; then
              echo "::warning file=$rule::Sigma validation issue detected"
              errors=$((errors + 1))
            fi
          done
          if [ $errors -gt 0 ]; then
            echo "::notice::$errors rule(s) have validation warnings - review above"
          else
            echo "All rules validated successfully!"
          fi
          # Don't fail the build - these are informational
          exit 0

      - name: Count rules
        run: |
          count=$(find rules -name "*.yml" | wc -l)
          echo "Total rules: $count"
          echo "## Sigma Detection Rules" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total: $count rules**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Category | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          for dir in rules/*/; do
            category=$(basename "$dir")
            category_count=$(find "$dir" -name "*.yml" | wc -l)
            echo "| $category | $category_count |" >> $GITHUB_STEP_SUMMARY
          done
