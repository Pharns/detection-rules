title: Anomalous Login Time - Off-Hours Access
id: 8b9c0d1e-2f3a-4b5c-6d7e-8f9a0b1c2d3e
status: experimental
description: |
  Detects successful interactive logins that should be reviewed for off-hours access.
  Time-based filtering (10 PM - 5 AM) should be implemented in SIEM query layer.
  This rule captures the base events; apply time filter in your SIEM.
author: Pharns Genece
date: 2025/01/15
modified: 2025/01/23
references:
  - https://attack.mitre.org/techniques/T1078/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4624  # Successful logon
    LogonType:
      - 2   # Interactive
      - 10  # RemoteInteractive (RDP)
      - 11  # CachedInteractive
  filter_service_accounts:
    TargetUserName|endswith: '$'
  filter_scheduled_tasks:
    TargetUserName|contains:
      - 'svc_'
      - 'backup'
      - 'admin_scheduled'
  filter_known_users:
    # Users with approved off-hours access (customize per environment)
    TargetUserName:
      - 'oncall_admin'
      - 'security_analyst'
  condition: selection and not filter_service_accounts and not filter_scheduled_tasks and not filter_known_users
fields:
  - TimeCreated
  - TargetUserName
  - IpAddress
  - WorkstationName
  - LogonType
falsepositives:
  - Legitimate after-hours work
  - On-call personnel
  - International employees in different timezones
  - Scheduled maintenance windows
level: low
tags:
  - attack.initial_access
  - attack.t1078
  - attack.persistence
  - attack.t1078.002
# Implementation Note:
# Time-based filtering must be applied in your SIEM query.
# Example for Elasticsearch: Add filter for @timestamp outside business hours
# Example for Splunk: Add | where date_hour >= 22 OR date_hour <= 5
