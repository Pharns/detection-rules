title: Authentication Brute Force Attempt
id: 7a8b9c0d-1e2f-3a4b-5c6d-7e8f9a0b1c2d
status: experimental
description: |
  Detects multiple failed authentication attempts from a single source,
  indicative of brute force or credential stuffing attacks.
  Threshold: 10 failures within 5 minutes.
author: Pharns Genece
date: 2025/01/15
modified: 2025/01/20
references:
  - https://attack.mitre.org/techniques/T1110/
  - https://attack.mitre.org/techniques/T1110/001/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4625  # Failed logon
      - 4771  # Kerberos pre-auth failed
  filter_service_accounts:
    TargetUserName|endswith: '$'  # Machine accounts
  filter_known_scanners:
    # Internal vulnerability scanners
    IpAddress|startswith:
      - '10.0.10.'  # Security scanning subnet
  condition: selection and not filter_service_accounts and not filter_known_scanners | count(TargetUserName) by IpAddress > 10
fields:
  - TimeCreated
  - IpAddress
  - TargetUserName
  - LogonType
  - FailureReason
  - Status
  - SubStatus
timeframe: 5m
falsepositives:
  - Misconfigured service accounts
  - Users with expired passwords
  - Legitimate vulnerability scanners
  - Password managers syncing
level: medium
tags:
  - attack.credential_access
  - attack.t1110
  - attack.t1110.001
  - attack.t1110.003
# Tuning notes:
# Initial FP rate: ~25%
# After tuning: ~8%
# Key improvements: Baseline normal hours per user group, service account filtering
