title: SMB Share Enumeration
id: 9c0d1e2f-3a4b-5c6d-7e8f-9a0b1c2d3e4f
name: smb_share_access_base
status: experimental
description: |
  Detects SMB share enumeration activity often used during lateral movement.
  Attackers enumerate accessible shares to identify targets for data access
  or lateral movement.
author: Pharns Genece
date: 2025/01/15
modified: 2025/01/20
references:
  - https://attack.mitre.org/techniques/T1021/002/
  - https://attack.mitre.org/techniques/T1135/
logsource:
  product: windows
  service: security
detection:
  selection_enum:
    EventID: 5140  # Network share accessed
    ShareName|contains:
      - 'IPC$'
      - 'ADMIN$'
      - 'C$'
  selection_multiple:
    # Multiple share access attempts in short timeframe
    EventID: 5140
  filter_admin_workstations:
    # Known admin workstations (customize per environment)
    IpAddress|startswith:
      - '10.0.50.'  # IT admin subnet
  filter_backup_servers:
    SubjectUserName|contains:
      - 'backup'
      - 'veeam'
      - 'commvault'
  condition: (selection_enum or selection_multiple) and not filter_admin_workstations and not filter_backup_servers
fields:
  - TimeCreated
  - SubjectUserName
  - IpAddress
  - ShareName
  - ShareLocalPath
falsepositives:
  - IT administrators performing inventory
  - Backup software
  - Vulnerability scanners
  - Asset management tools
level: medium
tags:
  - attack.lateral_movement
  - attack.t1021.002
  - attack.discovery
  - attack.t1135
# Tuning notes:
# Initial FP rate: ~30%
# After tuning: ~15%
# Key improvements: Admin workstation exclusion, service account filtering
---
title: SMB Share Enumeration (Correlation)
id: 3fc6ada3-7b41-401b-9183-621ea4e0c35d
status: experimental
description: |
  Correlation: more than 5 distinct shares accessed from one source IP within
  5 minutes. Replaces the deprecated pipe-count condition syntax.
author: Pharns Genece
date: 2025/01/15
modified: 2026/10/08
correlation:
  type: value_count
  rules:
    - smb_share_access_base
  group-by:
    - IpAddress
  timespan: 5m
  condition:
    field: ShareName
    gt: 5
level: medium
tags:
  - attack.lateral_movement
  - attack.t1021.002
