title: DNS Long Alphanumeric Subdomain - Potential Tunneling
id: 8a7c3b2d-4e5f-6a7b-8c9d-0e1f2a3b4c5d
status: experimental
description: |
  Flags DNS queries whose first label is 32+ lowercase alphanumeric characters,
  a common shape of encoded data in DNS tunneling (exfiltration or C2).
  NOTE: this rule does NOT calculate Shannon entropy. The long-label regex is a
  proxy for high-entropy subdomains; true entropy scoring must be done in the
  SIEM/analytics layer. Filename kept for backward compatibility.
author: Pharns Genece
date: 2025/01/15
modified: 2026/10/08
references:
  - https://attack.mitre.org/techniques/T1071/004/
  - https://www.sans.org/reading-room/whitepapers/dns/detecting-dns-tunneling-34152
logsource:
  product: zeek
  service: dns
detection:
  selection:
    # Long random subdomain pattern (32+ chars of alphanumeric)
    query|re: '^[a-z0-9]{32,}\.'
  filter_cdn:
    # Allowlist common CDN patterns that generate long subdomains
    query|endswith:
      - '.cloudfront.net'
      - '.akamaiedge.net'
      - '.fastly.net'
      - '.azureedge.net'
      - '.googleapis.com'
  filter_microsoft:
    query|endswith:
      - '.microsoft.com'
      - '.windows.com'
      - '.windowsupdate.com'
  condition: selection and not filter_cdn and not filter_microsoft
fields:
  - ts
  - id.orig_h
  - id.resp_h
  - query
  - qtype_name
  - answers
falsepositives:
  - CDN randomized hostnames (allowlisted above)
  - Cloud service auto-generated domains
  - Software update mechanisms with long hashes
  - Certificate transparency log queries
level: medium
tags:
  - attack.command_and_control
  - attack.t1071.004
  - attack.exfiltration
  - attack.t1048.003
# Tuning notes:
# Initial FP rate: ~35%
# After tuning: ~12%
# Key improvements: CDN allowlisting, entropy threshold adjustment
