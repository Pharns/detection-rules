title: HTTP Beaconing Pattern Detection
id: 4d5e6f7a-8b9c-0d1e-2f3a-4b5c6d7e8f9a
status: experimental
description: |
  Detects regular HTTP callback patterns indicative of C2 beaconing.
  Malware often beacons at consistent intervals (with jitter) to check for commands.
  This rule identifies repeated connections to the same host with similar timing patterns.
author: Pharns Genece
date: 2025/01/15
modified: 2025/01/20
references:
  - https://attack.mitre.org/techniques/T1071/001/
  - https://www.activecountermeasures.com/identifying-beacons/
logsource:
  product: zeek
  service: http
detection:
  selection:
    # Small response bodies typical of C2 check-ins
    response_body_len|lt: 1000
    # Common C2 callback methods
    method:
      - 'GET'
      - 'POST'
  selection_uri:
    # Suspicious URI patterns
    uri|re: '^/(api|update|check|ping|beacon|status|poll|sync|data|report)/?\??'
  selection_interval:
    # Note: Interval detection requires correlation logic in SIEM
    # This rule flags candidates for beaconing analysis
    uri|endswith:
      - '.php'
      - '.asp'
      - '.jsp'
  filter_legitimate:
    host|endswith:
      - '.microsoft.com'
      - '.google.com'
      - '.apple.com'
      - '.mozilla.org'
      - '.github.com'
      - '.amazonaws.com'
  condition: selection and (selection_uri or selection_interval) and not filter_legitimate
fields:
  - ts
  - id.orig_h
  - id.resp_h
  - host
  - uri
  - method
  - user_agent
  - response_body_len
falsepositives:
  - Legitimate software update checks
  - Monitoring agents (Datadog, New Relic)
  - Chat applications with polling
  - Browser extensions
level: medium
tags:
  - attack.command_and_control
  - attack.t1071.001
# Tuning notes:
# Initial FP rate: ~40%
# After tuning: ~18%
# Key improvements: Time-window correlation, user-agent filtering, allowlisting
